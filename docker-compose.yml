services:
  browser-mcp:
    build: .
    container_name: browser-mcp
    ports:
      - "9746:9746"
    shm_size: "2gb"
    environment:
      - VNC_RESOLUTION=1280x720x24
      - DISCOVERY_PORT=9099
      - MCP_PORT=9746
      # Kill idle Chrome after this many ms (default 2h); respawns on next use.
      - IDLE_TTL_MS=${IDLE_TTL_MS:-7200000}
    restart: unless-stopped
    networks:
      - mcp-network
      - mcp-net

networks:
  mcp-network:
    external: true
  mcp-net:
    external: true
