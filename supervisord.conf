[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_VNC_RESOLUTION)s -ac +extension GLX +render -noreset
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=bash -c 'PW=$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 8); echo -n "$PW" > /tmp/.vnc_password; exec x11vnc -display :99 -forever -shared -passwd "$PW" -rfbport 5900 -xkb'
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=websockify 6080 localhost:5900
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=fluxbox
priority=4
autorestart=true
environment=DISPLAY=":99",HOME="/root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Chrome itself is NOT managed by supervisord — the browser-mcp node process owns
# its lifecycle (lazy start + idle-TTL reaping). See src/chrome-manager.ts.
[program:browser-mcp]
command=node /app/dist/index.js
directory=/app
priority=5
autorestart=true
environment=DISPLAY=":99",NODE_ENV="production",CDP_PORT="9222",HOME="/root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
